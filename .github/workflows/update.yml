# Checks LinkedIn every hour and publishes the list to GitHub Pages and,
# once its two secrets are added, to Cloudflare Pages (<name>.pages.dev).
# One-time setup: Settings > Pages > Source: "GitHub Actions"; for Cloudflare,
# add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under
# Settings > Secrets and variables > Actions.
name: Check LinkedIn

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write            # keeps the hourly schedule from being switched off

env:
  SITE_NAME: internship-tracker   # Cloudflare address: https://internship-tracker-2um.pages.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Runs before the Pages steps, so it works (and shows whether LinkedIn
      # answers) even before Pages is switched on.
      - name: Check LinkedIn
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: python3 update.py "https://${OWNER,,}.github.io/${REPO}" site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # Cloudflare Pages: same files at an address without the GitHub username.
      # Skipped until the two secrets are added.
      - name: Create the Cloudflare site (first time only)
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true   # fails harmlessly once it exists
        run: npx --yes wrangler@3.114.17 pages project create "$SITE_NAME" --production-branch=main
      # The developer portal (/admin) keeps visit counts in a free Cloudflare D1
      # database. Needs the token to also have Account / D1 / Edit; until then
      # the site and portal still deploy, the portal just says it isn't connected.
      - name: Connect the portal database
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: |
          W="npx --yes wrangler@3.114.17"
          find_db() { $W d1 list --json 2>/dev/null | python3 -c 'import json,sys,re
          t=sys.stdin.read(); m=re.search(r"\[.*\]", t, re.S)
          print(next((d["uuid"] for d in json.loads(m.group(0)) if d["name"]=="tracker-analytics"), "") if m else "")'; }
          id=$(find_db)
          if [ -z "$id" ]; then $W d1 create tracker-analytics && id=$(find_db); fi
          if [ -z "$id" ]; then echo "::warning::No D1 database: add Account / D1 / Edit to the Cloudflare token"; exit 0; fi
          printf 'name = "%s"\npages_build_output_dir = "site"\ncompatibility_date = "2024-09-23"\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "tracker-analytics"\ndatabase_id = "%s"\n' "$SITE_NAME" "$id" > wrangler.toml
          $W d1 execute tracker-analytics --remote --file=schema.sql || { rm wrangler.toml; exit 0; }
          # Add columns that newer versions of the portal record (harmless if they exist).
          have=$($W d1 execute tracker-analytics --remote --json --command "SELECT name FROM pragma_table_info('events')" 2>/dev/null || true)
          for c in city region os net title screen lang ip; do
            echo "$have" | grep -q "\"$c\"" || $W d1 execute tracker-analytics --remote --command "ALTER TABLE events ADD COLUMN $c TEXT" || true
          done
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3.114.17 pages deploy site --project-name="$SITE_NAME" --branch=main --commit-dirty=true
      # GitHub pauses scheduled workflows after 60 days without a commit.
      # Re-enabling it on every run keeps the hourly check going.
      - name: Keep the schedule on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
