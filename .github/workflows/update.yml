# Checks LinkedIn every hour and publishes the list to GitHub Pages and,
# once its two secrets are added, to Cloudflare Pages (<name>.pages.dev).
# One-time setup: Settings > Pages > Source: "GitHub Actions"; for Cloudflare,
# add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under
# Settings > Secrets and variables > Actions.
name: Check LinkedIn

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write            # keeps the hourly schedule from being switched off

env:
  SITE_NAME: internship-tracker   # Cloudflare address: https://internship-tracker-2um.pages.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Runs before the Pages steps, so it works (and shows whether LinkedIn
      # answers) even before Pages is switched on.
      - name: Check LinkedIn
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: python3 update.py "https://${OWNER,,}.github.io/${REPO}" site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # Cloudflare Pages: same files at an address without the GitHub username.
      # Skipped until the two secrets are added.
      - name: Create the Cloudflare site (first time only)
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true   # fails harmlessly once it exists
        run: npx --yes wrangler@3.114.17 pages project create "$SITE_NAME" --production-branch=main
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3.114.17 pages deploy site --project-name="$SITE_NAME" --branch=main --commit-dirty=true
      # GitHub pauses scheduled workflows after 60 days without a commit.
      # Re-enabling it on every run keeps the hourly check going.
      - name: Keep the schedule on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
